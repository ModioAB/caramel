[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "caramel"
version = "1.9.6"
description = "caramel"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.7"
authors = [
    { name = "D.S. Ljungmark", email = "spider@modio.se" },
]
keywords = [
    "bfg",
    "ca",
    "cert",
    "certificates",
    "pylons",
    "pyramid",
    "ssl",
    "tls",
    "web",
    "wsgi",
    "x509",
]
classifiers = [
    "Framework :: Pyramid",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "cryptography >= 38",
    "legacy-cgi; python_version >= '3.13'",
    "pyOpenSSL >= 22.0.0",
    "pyramid",
    "pyramid_tm",
    "python-dateutil",
    "SQLAlchemy ~= 1.4.32",
    "transaction",
    "waitress",
    "zope.sqlalchemy >= 1.6",
]

[project.urls]
Homepage = "https://github.com/MyTemp/caramel"

[project.scripts]
caramel_initialize_db = "caramel.scripts.initializedb:main"
caramel_tool = "caramel.scripts.tool:main"
caramel_ca = "caramel.scripts.generate_ca:main"
caramel_autosign = "caramel.scripts.autosign:main"

[project.entry-points]
"paste.app_factory" = {main = "caramel:main"}

[tool.setuptools]
zip-safe = true
include-package-data = true
package-dir = {"" = "caramel"}

[dependency-groups]
dev = [
    "black>=23.3.0",
    "flake8>=5.0.4",
    "mypy>=1.4.1",
    "pylint>=2.13.9",
    "pylint-exit>=1.2.0",
    "sqlalchemy[mypy]<2",
    "types-python-dateutil>=2.8.19.14",
]

